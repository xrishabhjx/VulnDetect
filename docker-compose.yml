services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      CUDA_VISIBLE_DEVICES: ""
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data:ro
      - ./models/artifacts:/app/models/artifacts:ro
      - ./models/injection_classifier/artifacts:/app/models/injection_classifier/artifacts:ro
      - ./results:/app/results:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); assert r.get('status') == 'ok' and r.get('cve_cache_ready') is True"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
